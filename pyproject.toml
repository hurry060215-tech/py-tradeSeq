[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytradeseq"
version = "0.2.0"
description = "Pure-Python port of tradeSeq — trajectory-based differential expression analysis for scRNA-seq (Van den Berge et al. 2020)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Zehua Zeng", email = "starlitnightly@163.com" }]
keywords = ["single-cell", "scRNA-seq", "trajectory", "differential-expression", "tradeseq", "gam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=1.5",
    "statsmodels>=0.14",
    "scikit-learn>=1.2",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
slingshot = ["pyreadr>=0.5"]

[project.urls]
Homepage = "https://github.com/omicverse/py-tradeSeq"
Repository = "https://github.com/omicverse/py-tradeSeq"
"Upstream R package" = "https://github.com/statOmics/tradeSeq"

[tool.setuptools.packages.find]
include = ["pytradeseq*"]
exclude = ["tests*", "examples*", "tradeSeq-ref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
    "ignore::UserWarning",
]
